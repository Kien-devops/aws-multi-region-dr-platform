apiVersion: v1
kind: Namespace
metadata:
  name: infra-validation
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hello-content
  namespace: infra-validation
data:
  index.html: |
    singapore infrastructure validation
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
  namespace: infra-validation
spec:
  replicas: 2
  selector:
    matchLabels:
      app: infra-validation-hello
  template:
    metadata:
      labels:
        app: infra-validation-hello
    spec:
      containers:
        - name: hello
          # ponytail: disposable validation workload; pin a digest before production reuse.
          image: public.ecr.aws/nginx/nginx:stable-alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
              readOnly: true
      volumes:
        - name: content
          configMap:
            name: hello-content
---
apiVersion: v1
kind: Service
metadata:
  name: hello
  namespace: infra-validation
spec:
  selector:
    app: infra-validation-hello
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hello
  namespace: infra-validation
  annotations:
    alb.ingress.kubernetes.io/load-balancer-name: dr-sg-validation-alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hello
                port:
                  number: 80
