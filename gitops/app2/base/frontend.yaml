apiVersion: apps/v1
kind: Deployment
metadata:
  name: app2-frontend
  namespace: app2
  labels:
    app: app2-frontend
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app2-frontend
  template:
    metadata:
      labels:
        app: app2-frontend
    spec:
      containers:
        - name: frontend
          image: app2-frontend
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: PORT
              value: "3000"
            - name: FILE_SERVICE_BASE_URL
              value: ""
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: app2-frontend
  namespace: app2
  labels:
    app: app2-frontend
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: app2-frontend
