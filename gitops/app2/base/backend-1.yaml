apiVersion: apps/v1
kind: Deployment
metadata:
  name: app2-backend-1
  namespace: app2
  labels:
    app: app2-backend-1
    app.kubernetes.io/component: backend-1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app2-backend-1
  template:
    metadata:
      labels:
        app: app2-backend-1
    spec:
      containers:
        - name: backend-1
          image: app2-backend-1
          ports:
            - containerPort: 8081
              name: http
          env:
            - name: PORT
              value: "8081"
            - name: SERVICE_NAME
              value: "backend-1"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: app2-backend-1
  namespace: app2
  labels:
    app: app2-backend-1
spec:
  type: ClusterIP
  ports:
    - port: 8081
      targetPort: 8081
      protocol: TCP
      name: http
  selector:
    app: app2-backend-1
