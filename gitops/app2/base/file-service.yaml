apiVersion: apps/v1
kind: Deployment
metadata:
  name: app2-file-service
  namespace: app2
  labels:
    app: app2-file-service
    app.kubernetes.io/component: file-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app2-file-service
  template:
    metadata:
      labels:
        app: app2-file-service
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: file-service
          image: app2-file-service
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
            - name: AWS_REGION
              value: "ap-southeast-1"
            - name: STORAGE_PATH
              value: "/mnt/dr-data"
            - name: MAX_UPLOAD_BYTES
              value: "10485760"
            - name: CORS_ALLOWED_ORIGINS
              value: "*"
          volumeMounts:
            - name: ontap-storage
              mountPath: /mnt/dr-data
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: ontap-storage
          hostPath:
            path: /mnt/dr-data
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: app2-file-service
  namespace: app2
  labels:
    app: app2-file-service
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: app2-file-service
