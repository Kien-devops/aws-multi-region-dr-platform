apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  # EKS application artifact: storage EC2 labs do not apply this manifest.
  name: app2-singapore
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Kien-devops/aws-multi-region-dr-platform.git
    targetRevision: main
    path: gitops/app2/overlays/singapore
  destination:
    server: https://kubernetes.default.svc
    namespace: app2
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
