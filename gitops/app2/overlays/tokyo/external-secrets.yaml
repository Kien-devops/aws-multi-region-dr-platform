apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: app2-database
  namespace: app2
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-northeast-1
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app2-database
  namespace: app2
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: app2-database
    kind: SecretStore
  target:
    name: app2-db-secret
    creationPolicy: Owner
    template:
      type: Opaque
      mergePolicy: Merge
      data:
        DB_SSL: "true"
  data:
    - secretKey: DB_HOST
      remoteRef:
        key: /app2/database
        property: DB_HOST
    - secretKey: DB_PORT
      remoteRef:
        key: /app2/database
        property: DB_PORT
    - secretKey: DB_USER
      remoteRef:
        key: /app2/database
        property: DB_USER
    - secretKey: DB_PASSWORD
      remoteRef:
        key: /app2/database
        property: DB_PASSWORD
    - secretKey: DB_NAME
      remoteRef:
        key: /app2/database
        property: DB_NAME
