apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - path: patches/env-patches.yaml

labels:
  - pairs:
      region: ap-northeast-1
      environment: warm-standby
    includeSelectors: false

replicas:
  - name: app2-frontend
    count: 1
  - name: app2-backend-1
    count: 1
  - name: app2-backend-2
    count: 1
  - name: app2-backend-3
    count: 1

images:
  - name: app2-frontend
    newName: ACCOUNT_ID.dkr.ecr.ap-northeast-1.amazonaws.com/app2-frontend
  - name: app2-backend-1
    newName: ACCOUNT_ID.dkr.ecr.ap-northeast-1.amazonaws.com/app2-backend-1
  - name: app2-backend-2
    newName: ACCOUNT_ID.dkr.ecr.ap-northeast-1.amazonaws.com/app2-backend-2
  - name: app2-backend-3
    newName: ACCOUNT_ID.dkr.ecr.ap-northeast-1.amazonaws.com/app2-backend-3
