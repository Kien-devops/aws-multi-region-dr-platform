apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: app2

resources:
  - ../../base
  - external-secrets.yaml

configMapGenerator:
  - name: app2-frontend-runtime
    literals:
      - FILE_SERVICE_BASE_URL=

generatorOptions:
  disableNameSuffixHash: true

replacements:
  - source:
      kind: ConfigMap
      name: app2-frontend-runtime
      fieldPath: data.FILE_SERVICE_BASE_URL
    targets:
      - select:
          kind: Deployment
          name: app2-frontend
        fieldPaths:
          - spec.template.spec.containers.[name=frontend].env.[name=FILE_SERVICE_BASE_URL].value

patches:
  - path: patches/env-patches.yaml
  - path: patches/file-service-storage.yaml

labels:
  - pairs:
      region: ap-northeast-1
      environment: warm-standby
    includeSelectors: false

replicas:
  - name: app2-frontend
    count: 1
  - name: app2-backend-1
    count: 1
  - name: app2-backend-2
    count: 1
  - name: app2-backend-3
    count: 1
  - name: app2-file-service
    count: 1

images:
  - name: app2-frontend
    newName: 620306387033.dkr.ecr.ap-northeast-1.amazonaws.com/app2-frontend
  - name: app2-backend-1
    newName: 620306387033.dkr.ecr.ap-northeast-1.amazonaws.com/app2-backend-1
  - name: app2-backend-2
    newName: 620306387033.dkr.ecr.ap-northeast-1.amazonaws.com/app2-backend-2
  - name: app2-backend-3
    newName: 620306387033.dkr.ecr.ap-northeast-1.amazonaws.com/app2-backend-3
  - name: app2-file-service
    newName: 620306387033.dkr.ecr.ap-northeast-1.amazonaws.com/app2-file-service
