apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: app2

resources:
  - ../../base
  - pdb.yaml

configMapGenerator:
  - name: app2-frontend-runtime
    literals:
      - FILE_SERVICE_BASE_URL=

generatorOptions:
  disableNameSuffixHash: true

replacements:
  - source:
      kind: ConfigMap
      name: app2-frontend-runtime
      fieldPath: data.FILE_SERVICE_BASE_URL
    targets:
      - select:
          kind: Deployment
          name: app2-frontend
        fieldPaths:
          - spec.template.spec.containers.[name=frontend].env.[name=FILE_SERVICE_BASE_URL].value

patches:
  - path: patches/workload-ha-patches.yaml

labels:
  - pairs:
      region: ap-southeast-1
      environment: production-primary
    includeSelectors: false

replicas:
  - name: app2-frontend
    count: 2
  - name: app2-backend-1
    count: 2
  - name: app2-backend-2
    count: 2
  - name: app2-backend-3
    count: 2

images:
  - name: app2-frontend
    newName: ACCOUNT_ID.dkr.ecr.ap-southeast-1.amazonaws.com/app2-frontend
  - name: app2-backend-1
    newName: ACCOUNT_ID.dkr.ecr.ap-southeast-1.amazonaws.com/app2-backend-1
  - name: app2-backend-2
    newName: ACCOUNT_ID.dkr.ecr.ap-southeast-1.amazonaws.com/app2-backend-2
  - name: app2-backend-3
    newName: ACCOUNT_ID.dkr.ecr.ap-southeast-1.amazonaws.com/app2-backend-3
