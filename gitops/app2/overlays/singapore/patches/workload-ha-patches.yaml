apiVersion: apps/v1
kind: Deployment
metadata:
  name: app2-frontend
  namespace: app2
spec:
  template:
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: app2-frontend
      containers:
        - name: frontend
          env:
            - name: AWS_REGION
              value: ap-southeast-1
---
